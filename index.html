<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Inventario, ventas, apartados y gastos de HYPEFRIENDS BUSINESS." />
  <title>HYPEFRIENDS BUSINESS</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css?v=4" />
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <div class="brand login-brand">HYPE<span>FRIENDS</span><small>BUSINESS</small></div>
      <h1>INICIAR SESIÓN</h1>
      <p class="muted login-copy">Ingresa con tu cuenta de HYPEFRIENDS BUSINESS.</p>
      <div class="form">
        <label for="loginEmail">Correo</label>
        <input id="loginEmail" type="email" autocomplete="username" required placeholder="socio@hypefriends.com" />
        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Tu contraseña" />
        <button class="primary" type="submit">ENTRAR AL SISTEMA</button>
        <p id="loginError" class="login-error" role="status" aria-live="polite"></p>
      </div>
    </form>
  </section>

  <div id="app" class="hidden-app">
    <aside class="sidebar">
      <div>
        <div class="brand">HYPE<span>FRIENDS</span><small>BUSINESS</small></div>
        <nav aria-label="Navegación">
          <button class="nav active" data-view="dashboard">Dashboard</button>
          <button class="nav" data-view="sales">Ventas</button>
          <button class="nav" data-view="inventory">Inventario</button>
          <button class="nav" data-view="finance">Gastos</button>
          <button class="nav" data-view="customers">Clientes</button>
          <button class="nav" data-view="history">Historial</button>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <button id="installBtn" class="outline" type="button">INSTALAR APP</button>
        <div class="sync"><i id="syncDot"></i><span id="syncText">Conectando…</span></div>
        <div class="user-box">
          <span id="userEmail"></span>
          <button id="logoutBtn" class="logout" type="button">CERRAR SESIÓN</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">HYPEFRIENDS BUSINESS</div>
          <h1 id="viewTitle">DASHBOARD</h1>
        </div>
        <div class="top-actions">
          <button id="newSaleBtn" class="primary" type="button">+ NUEVA VENTA</button>
        </div>
      </header>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Formulario">
    <div class="modal-card">
      <button id="closeModal" class="close" type="button" aria-label="Cerrar">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js?v=4"></script>
</body>
</html>
